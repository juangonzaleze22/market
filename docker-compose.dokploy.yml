# ============================================================
# Compose para desplegar en Dokploy (Docker + Traefik).
#
# Diferencias con docker-compose.yml:
#   - El servicio `web` NO publica puertos en el host: Traefik
#     (que ocupa 80/443) lo enruta por la red `dokploy-network`.
#   - Se añaden labels de Traefik para el dominio (`APP_DOMAIN`)
#     y la redirección HTTP -> HTTPS con Let's Encrypt.
#
# En Dokploy: Create Application -> Docker Compose
#   Compose Path = ./docker-compose.dokploy.yml
#   Branch       = main
#   Environment  = variables de .env.example (+ APP_DOMAIN)
# ============================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en Environment}
      POSTGRES_DB: ${DB_NAME:-market_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - market

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      UPLOAD_ROOT: uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - market

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Sin `ports:` -> no expone 80/443 en el host; Traefik enruta el dominio.
    labels:
      - traefik.enable=true
      # Fuerza a Traefik a usar la red compartida (el contenedor está en 2 redes).
      - traefik.docker.network=dokploy-network
      # Router HTTPS
      - traefik.http.routers.market.rule=Host(`${APP_DOMAIN:?Define APP_DOMAIN en Environment}`)
      - traefik.http.routers.market.entrypoints=websecure
      - traefik.http.routers.market.tls.certresolver=letsencrypt
      - traefik.http.services.market.loadbalancer.server.port=80
      # Router HTTP -> redirige a HTTPS
      - traefik.http.routers.market-http.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.market-http.entrypoints=web
      - traefik.http.routers.market-http.middlewares=market-https
      - traefik.http.middlewares.market-https.redirectscheme.scheme=https
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - market
      - dokploy-network

volumes:
  db_data:
  uploads_data:

networks:
  market:
    driver: bridge
  # Red externa que crea Dokploy y a la que está conectado su Traefik.
  dokploy-network:
    external: true
